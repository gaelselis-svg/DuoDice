name: Build DuoDice APK v13.1 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract DuoDice source
        run: |
          rm -rf source
          mkdir source
          unzip -q DuoDice-Android-v13.1.zip -d source

      - name: Download and embed 50 licensed Wikimedia illustrations
        timeout-minutes: 8
        working-directory: source/DuoDice
        run: bash scripts/download_wikimedia_assets.sh

      - name: Verify 50 embedded illustrations
        working-directory: source/DuoDice
        run: |
          count=$(find app/src/main/res/drawable-nodpi -name 'position_*.webp' -type f -size +1000c | wc -l)
          echo "Found $count position assets"
          test "$count" -eq 50
          du -sh app/src/main/res/drawable-nodpi

      - name: Preflight Android resources
        timeout-minutes: 6
        working-directory: source/DuoDice
        run: |
          gradle --no-daemon --max-workers=2 --console=plain :app:processDebugResources --stacktrace --info

      - name: Preflight Kotlin compilation
        timeout-minutes: 8
        working-directory: source/DuoDice
        run: |
          gradle --no-daemon --max-workers=2 --console=plain :app:compileDebugKotlin --stacktrace --info

      - name: Build debug APK
        timeout-minutes: 8
        working-directory: source/DuoDice
        run: |
          gradle --no-daemon --max-workers=2 --console=plain :app:assembleDebug --stacktrace --info

      - name: Prepare APK
        run: cp source/DuoDice/app/build/outputs/apk/debug/app-debug.apk DuoDice-v13.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoDice-v13.1-Extreme-Kama50-APK
          path: DuoDice-v13.1.apk
          if-no-files-found: error
          retention-days: 30
